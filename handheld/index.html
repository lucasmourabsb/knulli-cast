<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KNULLI Cast</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/audio.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <main>
    <header><span class="badge">RG35XX SP</span><h1>Seu jogo na tela grande.</h1>
      <p>Abra um jogo no portátil e continue jogando com os botões dele.</p></header>
    <section class="screen" aria-label="Transmissão do portátil">
      <video id="video" playsinline controls></video>
      <audio id="audio"></audio>
    </section>
    <div class="actions">
      <button id="watch" autofocus>Assistir</button>
      <button id="fullscreen" class="secondary">Tela cheia</button>
      <button id="stop" class="secondary" disabled>Parar</button>
      <button id="enable-sound" class="secondary" hidden>Ativar som</button>
      <label class="sound"><input type="checkbox" id="sound" checked> Transmitir som</label>
    </div>
    <p id="status" role="status">Pronto para conectar.</p>
    <p class="note">Mantenha os dois aparelhos no mesmo Wi-Fi e o portátil aberto. Versão de teste: 640 × 480, até 60 quadros por segundo.</p>
  </main>
</body>
</html>
